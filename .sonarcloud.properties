# Duplication is measured on src/ only.
#
# Every test case here builds its own small fixture and asserts against it,
# which the duplication detector counts as copy-paste: 65 duplicated lines in
# test/routes.test.js alone, 0 anywhere in src/. Factoring those fixtures into
# shared builders would put the thing under test behind a parameter, and
# several cases exist precisely to pin down which shapes are NOT matched
# (`_.get("key")`, `cache.get("/x")`, `app.get("port")`) — a reader has to see
# what the fixture actually contained.
#
# So this narrows the metric rather than the tests. Duplication inside src/ is
# still a gate failure.
sonar.cpd.exclusions=test/**
