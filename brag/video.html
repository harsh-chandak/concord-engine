<!doctype html>
<meta charset="utf-8" />
<!--
  Renders brag/session.js, which is produced by brag/record.mjs running the
  real CLI and capturing its stdout and stderr verbatim. Nothing on screen is
  typed by hand except the user's prompt and the short narration lines, which
  are styled differently so they cannot be read as program output.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:880px; height:600px; background:#010409; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center;
         font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .term { width:848px; height:568px; background:#0d1117; border:1px solid #30363d;
          border-radius:10px; box-shadow:0 24px 70px rgba(0,0,0,.6); overflow:hidden;
          display:flex; flex-direction:column; }
  .bar { height:34px; flex:0 0 34px; background:#161b22; border-bottom:1px solid #30363d;
         display:flex; align-items:center; padding:0 14px; gap:8px; }
  .dot { width:11px; height:11px; border-radius:50%; }
  .title { color:#6e7681; font-size:12px; margin-left:10px; }
  .view { flex:1; overflow:hidden; position:relative; }
  .body { position:absolute; left:0; right:0; top:0; padding:14px 22px;
          font-size:23px; line-height:1.5; color:#c9d1d9; white-space:pre-wrap; word-break:break-word; }
  .prompt { color:#f0f6fc; font-weight:600; }
  .caret  { color:#58a6ff; font-weight:600; }
  .say    { color:#8b949e; }
  .cmd    { color:#58a6ff; }
  .out    { color:#c9d1d9; }
  .gn { color:#3fb950; } .rd { color:#f85149; } .yl { color:#d29922; } .dim { color:#6e7681; }
  .bad { background:#f8514918; border-left:3px solid #f85149; padding-left:19px; margin-left:-22px; }
  .good { border-left:3px solid #3fb950; padding-left:19px; margin-left:-22px; }
</style>
<div class="term">
  <div class="bar">
    <div class="dot" style="background:#ff5f56"></div><div class="dot" style="background:#ffbd2e"></div>
    <div class="dot" style="background:#27c93f"></div>
    <div class="title">claude code — concord-engine</div>
  </div>
  <div class="view"><div class="body" id="out"></div></div>
</div>
<script src="./session.js"></script>
<script>
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// Long outputs are shown in part so the whole run fits in one view. The
// elision is marked, with the real line count, rather than silently cropped.
const CAP = 5;
function clip(text) {
  const lines = text.split("\n");
  if (lines.length <= CAP) return lines;
  const hidden = lines.length - CAP;
  return [...lines.slice(0, CAP), `  … ${hidden} more lines`];
}

/** Colour a real output line by what it actually says. */
function paint(line) {
  const h = esc(line);
  if (/^\s*(refused|REFUSED)\b/.test(line)) return `<span class="rd">${h}</span>`;
  if (/\brefused\b/.test(line)) return `<span class="rd">${h}</span>`;
  if (/^\s*(pass|bound|recorded|contract accepted|✓)/.test(line)) {
    return h.replace(/^(\s*)(pass|bound|recorded|contract accepted|✓)/, '$1<span class="gn">$2</span>');
  }
  if (/criteria satisfied|% less|% MORE/.test(line)) return `<span class="yl">${h}</span>`;
  if (/^\s*(…|No tokenizer|A brief carries)/.test(line)) return `<span class="dim">${h}</span>`;
  if (/^(GOAL|FILES YOU OWN|DECISIONS ALREADY IN FORCE|WHAT YOU MAY DECIDE|WHAT YOU MUST NOT|STILL TO BE DECIDED|RECORD A DECISION|DONE MEANS|WAIT FOR|NOTES)/.test(line)) {
    return `<span class="yl">${h}</span>`;
  }
  return h;
}

// Flatten the session into display lines, each with the time it appears.
// The card loop shows the refusal arc, not the whole run. The full session
// scrolls for 16s, and scrolling repaints every pixel of every frame, which
// is what makes a GIF enormous — 1.2MB even at card size. The README keeps
// the full recording; a card wants the payoff. Still entirely real output.
const FROM = window.__SESSION.findIndex((s) => s.kind === "say" && /api worker settles/.test(s.text));
const SESSION = FROM === -1 ? window.__SESSION : window.__SESSION.slice(FROM);

const rows = [];
let t = 0.55;
for (const step of SESSION) {
  if (step.kind === "prompt") {
    rows.push({ t, html: `<span class="caret">&gt; </span><span class="prompt">${esc(step.text)}</span>` });
    t += 1.25;
  } else if (step.kind === "say") {
    rows.push({ t, html: `<span class="say">${esc(step.text)}</span>` });
    t += 0.6;
  } else if (step.kind === "cmd") {
    rows.push({ t, html: "" });
    rows.push({ t, html: `<span class="dim">$ </span><span class="cmd">${esc(step.text)}</span>` });
    t += 0.45;
  } else if (step.kind === "out") {
    const cls = step.code !== 0 ? "bad" : "";
    for (const line of clip(step.text)) {
      rows.push({ t, html: `<span class="out ${cls}">${paint(line)}</span>` });
      t += 0.05;
    }
    // Hold on a refusal: it is the thing the viewer came to see.
    t += step.code !== 0 ? 1.7 : 0.35;
  }
}

const DURATION = t + 1.2;
const el = document.getElementById("out");
const LINE = 23 * 1.5;
const VIEW = 568 - 34 - 28;

window.renderAt = (time) => {
  const shown = rows.filter((r) => r.t <= time);
  el.innerHTML = shown.map((r) => `<div>${r.html || "&nbsp;"}</div>`).join("");
  const overflow = shown.length * LINE - VIEW;
  el.style.transform = `translateY(${overflow > 0 ? -overflow : 0}px)`;
};

window.__duration = DURATION;
window.renderAt(0);
window.__ready = true;
</script>
