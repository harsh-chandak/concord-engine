name: publish
on:
  release: { types: [published] }
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # npm exchanges this OIDC token for publish rights

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      # Node 22 ships npm 10.x; trusted publishing needs >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public

  # The npm publish above is only half of a release: the MCP registry entry
  # points at a package version, and left behind it advertises the old one.
  # Both failed publish runs so far were the registry correctly refusing to
  # overwrite a version that had already been pushed by hand — the OIDC
  # exchange itself worked, which is why this is wired the same way.
  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: install mcp-publisher
        run: |
          set -euo pipefail
          # The release assets carry no version in their filename — the
          # version lives only in the tag — so resolve the tag and keep the
          # asset name fixed.
          TAG="$(curl -fsSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | jq -r .tag_name)"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${TAG}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: the registry version must match the package version
        run: |
          set -euo pipefail
          PKG="$(jq -r .version package.json)"
          SRV="$(jq -r .version server.json)"
          SRVPKG="$(jq -r '.packages[0].version' server.json)"
          if [ "$PKG" != "$SRV" ] || [ "$PKG" != "$SRVPKG" ]; then
            echo "version drift: package.json=$PKG server.json=$SRV packages[0]=$SRVPKG"
            exit 1
          fi
          echo "all three agree on $PKG"

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
