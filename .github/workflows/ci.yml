name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: end-to-end matrix (every kind, escalation path and detector)
        run: ./test/e2e.sh

      - name: end-to-end matrix for the loop (contract, bind, brief, accept, docs, cost)
        run: bash ./test/e2e-loop.sh

      - name: the package must still validate its own contract
        run: |
          # The repo dogfoods the loop: this contract drove v0.2's own build.
          # If a change breaks the validator, it breaks here before it breaks
          # for anyone who wrote a contract against the published schema.
          node dist/cli.js spec --from .orchestraguard/contracts/orchestraguard-v2.json --dir "$(mktemp -d)"
          # The worked example is cited in the README; it must stay valid too.
          node dist/cli.js spec --from examples/linkfold.contract.json --dir "$(mktemp -d)"

      - name: the gate must still refuse a contradicting decision
        run: |
          D=$(mktemp -d)
          node dist/cli.js decide --dir "$D" --kind naming --subject "user id" --value user_id --as backend-lead
          # --force: this step exists to create the disagreement that `check`
          # must then find. Since 0.2.0 `decide` refuses a contradiction by
          # default, so recording one is now an explicit act.
          node dist/cli.js decide --dir "$D" --kind naming --subject "User ID" --value userId --as frontend-lead --force
          if node dist/cli.js check --dir "$D" --json > out.json; then
            echo "REGRESSION: two leads disagreed and check exited 0"; exit 1
          fi
          node -e "
            const r = require('./out.json');
            if (r.conflicts.length !== 1) { console.error('expected 1 conflict, got ' + r.conflicts.length); process.exit(1) }
            if (r.conflicts[0].owner !== 'pm') { console.error('expected owner pm, got ' + r.conflicts[0].owner); process.exit(1) }
            console.log('gate holds: 1 conflict, owned by pm');
          "
