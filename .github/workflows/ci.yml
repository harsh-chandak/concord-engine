name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: the gate must still refuse a contradicting decision
        run: |
          D=$(mktemp -d)
          node dist/cli.js decide --dir "$D" --kind naming --subject "user id" --value user_id --as backend-lead
          node dist/cli.js decide --dir "$D" --kind naming --subject "User ID" --value userId --as frontend-lead
          if node dist/cli.js check --dir "$D" --json > out.json; then
            echo "REGRESSION: two leads disagreed and check exited 0"; exit 1
          fi
          node -e "
            const r = require('./out.json');
            if (r.conflicts.length !== 1) { console.error('expected 1 conflict, got ' + r.conflicts.length); process.exit(1) }
            if (r.conflicts[0].owner !== 'pm') { console.error('expected owner pm, got ' + r.conflicts[0].owner); process.exit(1) }
            console.log('gate holds: 1 conflict, owned by pm');
          "
